<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Customer Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
        <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: rgba(255, 255, 255, 0.07);
            --border-focus: rgba(124, 106, 255, 0.5);
            --accent: #7c6aff;
            --accent2: #ff6ab0;
            --accent3: #6affcf;
            --text: #f0f0f8;
            --muted: #6b6b8a;
            --danger: #ff6a6a;
            --success: #6affcf;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Grid bg ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(124, 106, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 106, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            animation: gridShift 25s linear infinite;
        }

        @keyframes gridShift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(60px);
            }
        }

        /* ── Blobs ── */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: blobFloat 18s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: var(--accent);
            opacity: 0.28;
            top: -180px;
            right: -120px;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: var(--accent2);
            opacity: 0.22;
            bottom: -120px;
            left: -100px;
            animation-delay: -8s;
        }

        .blob-3 {
            width: 260px;
            height: 260px;
            background: var(--accent3);
            opacity: 0.16;
            top: 40%;
            left: 30%;
            animation-delay: -14s;
        }

        @keyframes blobFloat {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(30px, 25px) scale(1.08);
            }
        }

        /* ── CARD ── */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: 24px;
            background: rgba(18, 18, 26, 0.85);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(124, 106, 255, 0.08);
            animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes cardIn {
            from {
                transform: translateY(40px) scale(0.96);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124, 106, 255, 0.6), transparent);
        }

        /* ── HEADING ── */
        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 36px;
        }

        /* ── FIELDS ── */
        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
            opacity: 0.5;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            appearance: none;
            -webkit-appearance: none;
        }

        .field input::placeholder {
            color: var(--muted);
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--border-focus);
            background: rgba(124, 106, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(124, 106, 255, 0.12);
        }

        /* Select arrow */
        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 11px;
            color: var(--muted);
        }

        /* Eye toggle */
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.4;
            padding: 0;
            transition: opacity 0.2s;
            width: auto;
        }

        .eye-btn:hover {
            opacity: 0.9;
        }

        /* Role pills */
        .role-pills {
            display: flex;
            gap: 10px;
            margin-top: 2px;
        }

        .role-pill {
            flex: 1;
            padding: 11px 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            transition: all 0.2s;
            user-select: none;
        }

        .role-pill:hover {
            border-color: rgba(124, 106, 255, 0.3);
            color: var(--text);
            background: rgba(124, 106, 255, 0.06);
        }

        .role-pill.active {
            border-color: var(--accent);
            background: rgba(124, 106, 255, 0.14);
            color: var(--text);
            font-weight: 600;
            box-shadow: 0 0 0 3px rgba(124, 106, 255, 0.1);
        }

        .role-pill .pill-icon {
            display: block;
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* Hidden real select */
        #role {
            display: none;
        }

        /* ── SUBMIT BTN ── */
        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 24px rgba(124, 106, 255, 0.35);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(124, 106, 255, 0.5);
        }

        .submit-btn:hover::after {
            opacity: 0.08;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .btn-spinner {
            display: block;
        }

        /* ── MESSAGE ── */
        #message {
            display: none;
            align-items: center;
            gap: 8px;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 13px;
            margin-top: 16px;
            animation: shake 0.4s ease;
        }

        #message.show {
            display: flex;
        }

        #message.error {
            background: rgba(255, 106, 106, 0.1);
            border: 1px solid rgba(255, 106, 106, 0.25);
            color: var(--danger);
        }

        #message.success {
            background: rgba(106, 255, 207, 0.08);
            border: 1px solid rgba(106, 255, 207, 0.25);
            color: var(--success);
            animation: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 20px;
            color: var(--muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── LOGIN LINK ── */
        .login-link {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .login-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: var(--accent2);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(124, 106, 255, 0.4);
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card">

        <div class="eyebrow">✦ Get started</div>
        <h2>Create account</h2>
        <p class="subtitle">Fill in your details to join the portal.</p>

        <form id="registerForm" autocomplete="off">

            <!-- Username -->
            <div class="field">
                <label>Username</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Choose a username" autocomplete="off">
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="Create a password" autocomplete="new-password">
                    <button type="button" class="eye-btn" id="eyeBtn">👁</button>
                </div>
            </div>

            <!-- Role -->
            <div class="field">
                <label>Role</label>
                <div class="role-pills">
                    <div class="role-pill active" data-value="CUSTOMER">
                        <span class="pill-icon">🛍</span>Customer
                    </div>
                    <div class="role-pill" data-value="AGENT">
                        <span class="pill-icon">🎧</span>Agent
                    </div>

                </div>
                <select id="role">
                    <option value="CUSTOMER">Customer</option>
                    <option value="AGENT">Agent</option>

                </select>
            </div>

            <button type="submit" class="submit-btn" id="registerBtn">
                <span class="btn-text">Create Account →</span>
                <div class="btn-spinner"></div>
            </button>

            <div id="message">
                <span id="msgIcon">⚠️</span>
                <span id="messageText">Something went wrong.</span>
            </div>

        </form>

        <div class="divider">or</div>

        <div class="login-link">
            Already have an account? <a href="/api/auth/login-page/">Sign in</a>
        </div>

    </div>

    <script>
        // Role pill selector
        const pills = document.querySelectorAll('.role-pill');
        const roleSelect = document.getElementById('role');

        pills.forEach(pill => {
            pill.addEventListener('click', () => {
                pills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                roleSelect.value = pill.dataset.value;
            });
        });

        // Eye toggle
        const eyeBtn = document.getElementById('eyeBtn');
        const pwdInput = document.getElementById('password');
        eyeBtn.addEventListener('click', () => {
            const isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            eyeBtn.textContent = isHidden ? '🙈' : '👁';
        });

        // Form submit
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;
            const btn = document.getElementById("registerBtn");
            const msg = document.getElementById("message");
            const msgText = document.getElementById("messageText");
            const msgIcon = document.getElementById("msgIcon");

            if (!username || !password) {
                msgIcon.textContent = "⚠️";
                msgText.textContent = "Please fill in all fields.";
                msg.className = "show error";
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;
            msg.classList.remove('show');

            fetch("/api/auth/register/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, role })
            })
                .then(res => res.json())
                .then(data => {
                    btn.classList.remove('loading');
                    btn.disabled = false;

                    if (data.message && !data.error) {
                        msgIcon.textContent = "✅";
                        msgText.textContent = data.message || "Account created! Redirecting…";
                        msg.className = "show success";
                        setTimeout(() => window.location.href = "/api/auth/login/", 1500);
                    } else {
                        msgIcon.textContent = "⚠️";
                        msgText.textContent = data.message || data.error || "Registration failed.";
                        msg.className = "show error";
                    }
                })
                .catch(() => {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    msgIcon.textContent = "⚠️";
                    msgText.textContent = "Network error. Please try again.";
                    msg.className = "show error";
                });
        });

        // Clear message on input
        ['username', 'password'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                document.getElementById('message').classList.remove('show');
            });
        });
    </script>

</body>

</html>
